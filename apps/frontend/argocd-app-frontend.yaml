apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: capstone-frontend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ronakpandey/devops-capstone-gitops.git
    targetRevision: main
    path: apps/frontend
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true